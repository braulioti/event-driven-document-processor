services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: document-processor-api
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/health'')"',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  network-check:
    image: docker.io/curlimages/curl:8.5.0
    depends_on:
      api:
        condition: service_healthy
    command: ["curl", "-fsS", "http://document-processor-api:8000/health"]
    networks:
      - app-network
    restart: "no"

networks:
  app-network:
    driver: bridge
